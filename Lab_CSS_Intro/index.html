<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Introdução ao CSS</title>
    <!-- Script imediato para aplicar o tema salvo sem efeito de piscar (FOUC) -->
    <script>
        (function () {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="topbar">
        <div class="topbar-wrapper">
            <div class="header-titles">
                <h1 id="titulo">Cadastro Acadêmico</h1>
                <p class="sub">Vamos aplicar CSS: seletores, cores, fontes e estilos básicos.</p>
            </div>
            <button id="theme-toggle" class="theme-toggle-btn" type="button" aria-label="Mudar para modo noturno" title="Mudar para modo noturno">
                <span class="theme-icon">
                    <!-- Ícone de Lua (modo claro) -->
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <!-- Ícone de Sol (modo escuro) -->
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </span>
                <span class="theme-toggle-text">Modo Escuro</span>
            </button>
        </div>
    </header>
    <main class="container">
        <section class="card">
            <h2 class="destaque">Formulário (base)</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Dados do Aluno</legend>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required />
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@email.com" />
                    <label for="msg">Mensagem:</label>
                    <textarea id="msg" name="mensagem" rows="4"></textarea>
                    <div class="acoes">
                        <button type="submit">Enviar</button>
                        <button type="reset" class="secundario">Limpar</button>
                    </div>
                </fieldset>
            </form>
            <div class="alerta" role="alert">
                Exemplo de alerta: verifique os campos obrigatórios.
            </div>
            <div class="sucesso" role="sucess">
                Exemplo de alerta: sua operação foi um sucesso!
            </div>
        </section>
    </main>
    <footer class="rodape">
        <small>Exercício Prático - Introdução ao CSS</small>
    </footer>

    <script src="script.js"></script>
</body>

</html>
